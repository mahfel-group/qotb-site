<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صفحه آزمایشی قطب</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#20242b;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--page-bg,#f4f5f7);color:var(--page-color,#20242b)}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#fff;border-bottom:1px solid #e5e7eb}
.brand{font-weight:700}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:#20242b;color:white}
main{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:28px}
.empty{width:min(720px,100%);min-height:300px;border:2px dashed #cbd0d8;border-radius:18px;display:grid;place-items:center;text-align:center;padding:32px;color:#858b96}
.empty strong{display:block;color:inherit;font-size:22px;margin-bottom:10px}
.panel{position:fixed;inset:0 0 0 auto;width:min(370px,92vw);background:white;box-shadow:-15px 0 45px #0002;z-index:5;padding:22px;transform:translateX(110%);transition:.22s;overflow:auto}
.panel.open{transform:translateX(0)}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
label{display:block;font-size:13px;margin:16px 0 7px;color:#555}input{width:100%;padding:11px;border:1px solid #d8dce2;border-radius:9px;font:inherit}
.note{font-size:12px;color:#777;line-height:1.8;margin-top:20px}.overlay{display:none;position:fixed;inset:0;background:#0005;z-index:4}.overlay.show{display:block}
</style>
</head>
<body>
<header class="top"><div class="brand">قطب | محیط آزمایشی</div><button id="openPanel">پنل مدیریت</button></header>
<main><section class="empty" id="canvas"><div><strong>صفحهٔ آزمایشی جدید</strong>این فضا عمداً خالی است؛ طراحی را از صفر اینجا امتحان می‌کنیم.</div></section></main>
<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel" aria-label="پنل مدیریت">
<div class="panel-head"><b>پنل مدیریت آزمایشی</b><button id="closePanel" aria-label="بستن">×</button></div>
<label for="bg">رنگ پس‌زمینه</label><input id="bg" type="color" value="#f4f5f7">
<label for="color">رنگ نوشته</label><input id="color" type="color" value="#20242b">
<label for="heading">عنوان صفحه</label><input id="heading" type="text" value="صفحهٔ آزمایشی جدید">
<label for="description">متن زیر عنوان</label><input id="description" type="text" value="این فضا عمداً خالی است؛ طراحی را از صفر اینجا امتحان می‌کنیم.">
<p class="note">این یک محیط مستقل و آزمایشی است. تغییرات فقط در همین مرورگر ذخیره می‌شوند و به سایت اصلی، فایل اصلی یا اطلاعات محصولات وصل نیستند.</p>
<button id="reset" style="width:100%;margin-top:8px;background:#e9edf2;color:#20242b">بازنشانی صفحه</button>
</aside>
<script>
const $=id=>document.getElementById(id), panel=$('panel'), overlay=$('overlay');
function toggle(open){panel.classList.toggle('open',open);overlay.classList.toggle('show',open)}
$('openPanel').onclick=()=>toggle(true);$('closePanel').onclick=()=>toggle(false);overlay.onclick=()=>toggle(false);
function apply(){document.body.style.setProperty('--page-bg',$('bg').value);document.body.style.setProperty('--page-color',$('color').value);$('canvas').querySelector('strong').textContent=$('heading').value;$('canvas').querySelector('div').lastChild.textContent=$('description').value;localStorage.setItem('qotb-playground',JSON.stringify({bg:$('bg').value,color:$('color').value,heading:$('heading').value,description:$('description').value}))}
['bg','color','heading','description'].forEach(id=>$(id).addEventListener('input',apply));
try{const saved=JSON.parse(localStorage.getItem('qotb-playground'));if(saved){Object.entries(saved).forEach(([k,v])=>{if($(k))$(k).value=v});apply()}}catch{}
$('reset').onclick=()=>{localStorage.removeItem('qotb-playground');$('bg').value='#f4f5f7';$('color').value='#20242b';$('heading').value='صفحهٔ آزمایشی جدید';$('description').value='این فضا عمداً خالی است؛ طراحی را از صفر اینجا امتحان می‌کنیم.';apply()};
</script>
</body>
</html>
