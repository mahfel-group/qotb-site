<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پیش‌نمایش نسخه آزمایشی قطب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Arial,sans-serif;background:#f2f3f5;color:#171717}.bar{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 3px 14px #0002}.bar strong{font-size:14px}.bar small{display:block;color:#aaa;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{font:600 12px Vazirmatn;border:1px solid #444;border-radius:9px;padding:9px 13px;background:#222;color:#fff;text-decoration:none;cursor:pointer}.state{padding:9px 16px;background:#fff;border-bottom:1px solid #ddd;color:#666;font-size:12px}iframe{display:block;width:100%;height:calc(100vh - 100px);min-height:650px;border:0;background:#fff}.login{max-width:520px;margin:12vh auto;padding:26px;background:#fff;border:1px solid #ddd;border-radius:16px;line-height:2}.login a{display:inline-block;margin-top:10px}
</style></head>
<body>
<header class="bar"><div><strong>پیش‌نمایش مستقل فروشگاه قطب</strong><small>نسخه آزمایشی — بدون تغییر در سایت اصلی</small></div><div class="actions"><button id="refresh">بارگذاری دوباره تغییرات</button><a href="admin.html">بازگشت به پنل مدیریت</a></div></header>
<div class="state" id="state">در حال دریافت تغییرات ذخیره‌شده…</div>
<iframe id="site" title="پیش‌نمایش مستقل سایت قطب" src="../index.html"></iframe>
<script>
(()=>{'use strict';
const API='https://api.mirzaie-qotb.ir',RECORD='playground-site-snapshot',KEY='qotb_playground_admin';
const $=id=>document.getElementById(id);let doc=null;
function say(s){$('state').textContent=s}
function apply(patches){if(!doc)throw Error('صفحهٔ سایت هنوز آماده نیست.');for(const p of patches||[]){let el=doc.body;for(const i of p.path||[])el=el?.children?.[i];if(!el)continue;if(p.kind==='text')el.innerHTML=p.value;else if(p.kind==='image-slot'){el.innerHTML='';const im=doc.createElement('img');im.src=p.value;im.alt='تصویر محصول';im.style.cssText='width:100%;height:100%;object-fit:contain';el.append(im)}else if(p.kind==='delete-image')el.querySelectorAll('img').forEach(im=>im.remove())}}
async function load(){try{const token=sessionStorage.getItem(KEY);if(!token){say('برای دیدن نسخهٔ ذخیره‌شده، ابتدا در پنل مدیریت وارد شو و از همان صفحه «نمایش مستقل سایت» را بزن.');return}
say('در حال دریافت تغییرات ذخیره‌شده…');const r=await fetch(API+'/api/content',{headers:{Authorization:'Bearer '+token},mode:'cors'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطای سرور: '+r.status);const item=(d.items||[]).find(x=>x.id===RECORD);apply(item?.data?.patches||[]);say(item?.status==='published'?'نسخهٔ آزمایشی منتشرشده نمایش داده می‌شود.':'پیش‌نویس ذخیره‌شده نمایش داده می‌شود.');}catch(e){say('بارگذاری تغییرات ناموفق بود: '+e.message)}}
$('site').addEventListener('load',()=>{try{doc=$('site').contentDocument;load()}catch{say('دسترسی به صفحهٔ پیش‌نمایش ممکن نشد.')}});$('refresh').addEventListener('click',load);
})();
</script></body></html>
